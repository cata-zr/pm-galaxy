# Static SPA served straight off disk.
#
# Two things matter here. The routes are hash-based (`/#/tax-engine`), so the
# server only ever sees `/` — there is no server-side routing to get wrong. And
# a redeploy must not leave anyone on a stale bundle, which is what the split
# caching policy below is for.

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # The JS bundle is ~230 kB raw, ~73 kB gzipped — worth compressing.
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

    # Vite fingerprints these filenames, so a given URL's contents can never
    # change. Safe to cache for a year.
    location /assets/ {
        try_files  $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # index.html is the one file that must never be cached: it is what points at
    # the fingerprinted assets, so a stale copy after a redeploy would ask for
    # bundles that no longer exist and the page would come up blank.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Container liveness only — kept out of the access log so it does not drown
    # the real traffic.
    location = /healthz {
        access_log   off;
        default_type text/plain;
        return       200 "ok\n";
    }

    # The Jira adapter. This is what makes the whole thing possible: the browser
    # only ever talks to *this* origin, so there is no cross-origin request and
    # no preflight to be refused, and the API token stays in the api container.
    #
    # Note the literal hostname. nginx resolves it once at startup, which is why
    # docker-compose.yml makes this service wait for `api` to report healthy. A
    # variable + `resolver` would re-resolve per request, but the resolver
    # address differs between Docker and Podman and this file has to work on
    # both. Consequence: if you restart `api` on its own it may come back on a
    # new address and this container will 502 until it is restarted too.
    location /api/ {
        proxy_pass         http://api:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # A full galaxy is several JQL searches per epic, so allow for a slow
        # first load on a big instance.
        proxy_read_timeout 120s;

        # No `add_header Cache-Control` here on purpose: the api sets `no-store`
        # on every response it produces, including its own errors, and nginx's
        # add_header *appends* rather than replaces — so setting it here too put
        # the header on the response twice.
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
