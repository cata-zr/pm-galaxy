# Static SPA served straight off disk.
#
# Two things matter here. The routes are hash-based (`/#/tax-engine`), so the
# server only ever sees `/` — there is no server-side routing to get wrong. And
# a redeploy must not leave anyone on a stale bundle, which is what the split
# caching policy below is for.

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # The JS bundle is ~230 kB raw, ~73 kB gzipped — worth compressing.
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

    # Vite fingerprints these filenames, so a given URL's contents can never
    # change. Safe to cache for a year.
    location /assets/ {
        try_files  $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # index.html is the one file that must never be cached: it is what points at
    # the fingerprinted assets, so a stale copy after a redeploy would ask for
    # bundles that no longer exist and the page would come up blank.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Container liveness only — kept out of the access log so it does not drown
    # the real traffic.
    location = /healthz {
        access_log   off;
        default_type text/plain;
        return       200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
